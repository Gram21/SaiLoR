[package]
name = "sailor"
version = "0.0.0"
edition = "2021"

[features]
# CI probe commands (`probe_auto`, `probe_report`). Never in a release build.
probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "net", "time", "sync", "rt-multi-thread", "process"] }
url = "2"
encoding_rs = "0.8"
keyring = "4"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
ring = "0.17"
unicode-normalization = "0.1"
lopdf = { version = "0.46", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
