services:
  sailor:
    build:
      context: .
      dockerfile: Dockerfile
    image: sailor:latest
    container_name: sailor
    ports:
      # host:container — browse to http://localhost:8080
      - "8080:80"
    volumes:
      # Point this at your own folder of project JSONs + their pdfs/ folders; the
      # bundled example (./samples) is what's mounted by default. Whatever folder you
      # mount is served under /projects/, so open it with
      # http://localhost:8080/?project=/projects/<your-project>.json
      # Mounted read-only: the browser saves via download, never back to the server.
      - ./samples:/usr/share/nginx/html/projects:ro
    restart: unless-stopped
