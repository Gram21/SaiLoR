name: Tauri spike

# Phase 0 of docs/tauri-migration.md: build the spike on every OS and prove
# pdf.js renders a PDF in each system WebView. Runs on pushes to spike/tauri and manually.

on:
  push:
    branches: [release/2.0.0, spike/tauri]
  workflow_dispatch:

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (installer bundle)
        run: npx tauri build

      - name: Report installer sizes
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec ls -l {} \;

      - name: Run probe (open project, traversal check, render PDF)
        env:
          SPIKE_PROJECT: ${{ github.workspace }}/samples/project.example.json
          SPIKE_REPORT: ${{ runner.temp }}/spike-report.txt
        run: |
          rm -f "$SPIKE_REPORT"
          BIN=src-tauri/target/release/sailor-spike
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            xvfb-run -a "$BIN" > /dev/null 2>&1 &
          else
            "$BIN" > /dev/null 2>&1 &
          fi
          PID=$!
          for i in $(seq 1 60); do
            grep -qE "RENDER OK|PDF ERROR|RENDER ERROR" "$SPIKE_REPORT" 2>/dev/null && break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          echo "---- report ----"
          cat "$SPIKE_REPORT" || true
          grep -q "RENDER OK" "$SPIKE_REPORT"
          grep -q -- "-> 403" "$SPIKE_REPORT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-report-${{ matrix.os }}
          path: ${{ runner.temp }}/spike-report.txt
          if-no-files-found: ignore
