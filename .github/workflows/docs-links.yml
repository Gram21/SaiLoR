name: Docs links

# Documentation-only changes skip the full CI workflow (see paths-ignore in ci.yml).
# This light workflow checks the links in the wiki and the user guide instead.
# It runs scripts/check-wiki-links.js, which needs no installed dependencies.
# It skips itself when a changed file lies outside the CI ignore list, because the
# full CI workflow runs then and already checks the links.

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'openwiki/**'
      - 'user-guide/**'
      - 'scripts/check-wiki-links.js'
      - '.github/workflows/docs-links.yml'
  pull_request:
    paths:
      - 'openwiki/**'
      - 'user-guide/**'
      - 'scripts/check-wiki-links.js'
      - '.github/workflows/docs-links.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check whether the full CI runs
        id: ci
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Build the pattern from the first paths-ignore line of ci.yml (push trigger),
          # so both workflows share one list. 'dir/**' matches a prefix, 'file' matches exactly.
          ignored=$(grep -m1 'paths-ignore' .github/workflows/ci.yml | grep -o "'[^']*'" | tr -d "'" \
            | sed -e 's/\./\\./g' -e 's#/\*\*$#/#' -e 's/.*[^/]$/&$/' -e 's/^/^/' | paste -sd'|' -)
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          elif grep -qvE "$ignored" changed.txt; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.ci.outputs.full == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Check wiki and user guide links
        if: steps.ci.outputs.full == 'false'
        run: node scripts/check-wiki-links.js
