name: Import Wiki → openwiki

# The reverse of wiki-publish.yml: when someone edits the wiki — in the browser, or by
# pushing to SaiLoR.wiki.git — copy those pages back into openwiki/ (developer-docs
# content pages), user-guide/ (the user guide — unflattened back to its own folder and
# original page names), and .github/wiki-assets/ (the Home page, the developer-docs
# Sidebar.md/Footer.md, and the two "User Guide" fragments appended to them) and commit
# them to main, so all three stay the source of truth rather than drifting behind the
# wiki. See wiki-publish.yml's header for the wiki's full layout (Home.md /
# Development.md / User-Guide.md, Guide-*.md, and why); this workflow undoes exactly
# that mapping.
#
# `gollum` fires when a wiki page is created or updated. Note the GitHub constraint:
# it only runs a workflow when the workflow file is on the DEFAULT branch, so this file
# has no effect until it is merged to main.

on:
  gollum:
  workflow_dispatch:

permissions:
  contents: write

# Shared with wiki-publish.yml so the two directions can never run concurrently.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # Loop prevention, layer 2: ignore wiki writes made by the publish workflow itself.
    # A human editing in the web UI is the sender we care about.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.sender.login != 'github-actions[bot]' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Copy the wiki's pages into openwiki/, user-guide/ and .github/wiki-assets/
        run: |
          set -euo pipefail

          # Home.md is published from .github/wiki-assets/Home.md verbatim, first line
          # `<!-- wiki-sync:auto-home -->` (see wiki-publish.yml). That marker is the
          # signal this file is still exactly what was published, so still-marked means
          # nobody touched it here — drop it rather than import a no-op "edit". Its
          # absence means a human replaced the content wholesale; their version becomes
          # the new template, imported into the asset file it was published from (not
          # into openwiki/Home.md — that page is Development.md now, see below).
          if [ -f wiki/Home.md ]; then
            if head -1 wiki/Home.md | grep -q 'wiki-sync:auto-home'; then
              rm -f wiki/Home.md
            else
              cp wiki/Home.md .github/wiki-assets/Home.md
              rm -f wiki/Home.md
            fi
          fi

          # Development.md is openwiki/Home.md under its published name (renamed by
          # wiki-publish.yml so the wiki's own Home slot is free for the landing page
          # above) — map it back to where it actually came from before the general
          # openwiki mirror below, the same as any other page a human might have edited.
          if [ -f wiki/Development.md ]; then
            mv wiki/Development.md wiki/Home.md
          fi

          # _Sidebar.md and _Footer.md each carry a "User Guide" fragment wiki-publish.yml
          # appends inside a `<!-- wiki-sync:NAME:start/end -->` comment pair (see its
          # comment on why it's appended rather than authored into openwiki/ or
          # .github/wiki-assets/Sidebar.md and Footer.md directly). Lift whatever is
          # currently between those markers — wiki-publish.yml's own text if nobody
          # touched it, a human's edit otherwise, this doesn't need to know which — into
          # the asset file it was published from, and cut it back out of the page so the
          # remainder is the plain developer-docs Sidebar.md/Footer.md again.
          extract_marked_block() {
            page="$1" marker="$2" asset="$3"
            start="<!-- wiki-sync:${marker}:start -->"
            end="<!-- wiki-sync:${marker}:end -->"
            if [ -f "$page" ] && grep -qF "$start" "$page"; then
              awk -v s="$start" -v e="$end" '$0==s{f=1;next} $0==e{f=0} f' "$page" > "$asset"
              awk -v s="$start" -v e="$end" '$0==s{skip=1} !skip{print} $0==e{skip=0}' "$page" > "$page.tmp"
              mv "$page.tmp" "$page"
            fi
          }
          extract_marked_block wiki/_Sidebar.md user-guide-sidebar .github/wiki-assets/Sidebar-user-guide.md
          extract_marked_block wiki/_Footer.md user-guide-footer .github/wiki-assets/Footer-user-guide.md

          # wiki-publish.yml rewrites .github/wiki-assets/Sidebar.md's own "SaiLoR" link
          # from Home to Development (Home.md is staged under that name — see its
          # comment). Reverse it here too, unconditionally, for the same reason as the
          # user-guide/README.md links above: the asset file's own copy needs to say
          # `Home` — the real openwiki page name — so scripts/check-wiki-links.js can
          # keep validating it against the actual openwiki page set.
          [ -f wiki/_Sidebar.md ] && sed -i 's/\](Development)/\](Home)/' wiki/_Sidebar.md

          # Unlike the developer-docs pages the general openwiki rsync handles below,
          # _Sidebar.md/_Footer.md do not live in openwiki/ (see wiki-publish.yml's
          # header for why) — map what is left of each, after the fragment above was
          # lifted out, straight to the asset file it was published from instead.
          [ -f wiki/_Sidebar.md ] && mv wiki/_Sidebar.md .github/wiki-assets/Sidebar.md
          [ -f wiki/_Footer.md ] && mv wiki/_Footer.md .github/wiki-assets/Footer.md

          # The user guide's pages are published flat at the wiki root, under new names
          # (README -> User-Guide, screening -> Guide-Screening, …) — see
          # wiki-publish.yml's header for why (GitHub's hosted wiki does not serve pages
          # in a subdirectory). Reverse both rewrites wiki-publish.yml applied and move
          # each page back to user-guide/$src.md, before the general openwiki rsync
          # below, so the flat pages neither collide with an openwiki page of the
          # same name nor get left behind under their published name.
          GUIDE_PAGES="README:User-Guide things-to-know:Guide-Things-To-Know getting-started:Guide-Getting-Started screening:Guide-Screening multi-reviewer:Guide-Multi-Reviewer project-editor:Guide-Project-Editor git:Guide-Git"

          # Cross-page links (`[Screening](Guide-Screening)`) back to their original,
          # unflattened form (`[Screening](screening.md)`) — same "no trailing `)`/`#`
          # in the pattern" reasoning as the forward rewrite, so an anchored link
          # (`(Guide-Git#field-level-commit-review)`) comes back as
          # `(git.md#field-level-commit-review)` correctly.
          for pair in $GUIDE_PAGES; do
            dest="${pair#*:}"
            [ -f "wiki/$dest.md" ] || continue
            sed -i "s#(${dest}#(${pair%%:*}.md#g" wiki/*.md
          done

          # User-Guide.md's own two absolute-GitHub-URL links, back to the repo-relative
          # form user-guide/README.md actually uses — unconditional, for the same reason
          # as the equivalent rewrite used to be here: whether or not a human touched
          # this page, it must not drift from what user-guide/README.md is supposed to
          # say.
          if [ -f wiki/User-Guide.md ]; then
            sed -i \
              -e "s#(https://github.com/${GITHUB_REPOSITORY}/blob/main/README\.md)#(../README.md)#" \
              -e "s#(https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE)#(../LICENSE)#" \
              wiki/User-Guide.md
          fi

          # Move each page that exists back to its unflattened path and name.
          for pair in $GUIDE_PAGES; do
            dest="${pair#*:}"
            [ -f "wiki/$dest.md" ] && mv "wiki/$dest.md" "user-guide/${pair%%:*}.md"
          done

          # screenshots/ is published flat at the wiki root too (see wiki-publish.yml)
          # — move it back under user-guide/, same "only touch it if the wiki side
          # actually has it" guard as the old user-guide/ directory move had, so a wiki
          # clone that is temporarily missing it (a very first run against an older
          # wiki, say) can never be mistaken for "the screenshots were all deleted" and
          # wipe out the repo's real copies.
          if [ -d wiki/screenshots ]; then
            rsync -a --delete wiki/screenshots/ user-guide/screenshots/
            rm -rf wiki/screenshots
          fi

          # Mirror pages only, and only over the pages: openwiki/.last-update.json is
          # generator state and must survive. The user guide's pages and screenshots/,
          # and wiki/_Sidebar.md and wiki/_Footer.md, were all already moved out above,
          # so none of them land in openwiki/ here.
          #
          # Edge case, not worth guarding against: wiki-publish.yml deliberately never
          # publishes index.md or INSTRUCTIONS.md (see its comment) or frontmatter
          # (stripped on publish), so none of these round-trip back in here under normal
          # operation. If a human manually creates a wiki page literally named "index" or
          # "INSTRUCTIONS", it lands at the matching path in openwiki/ once — then
          # wiki-publish.yml's exclusion means it is never mirrored back out, so the next
          # publish silently stops reflecting further edits to it.
          rsync -a --delete \
            --include '*.md' --exclude '*' \
            wiki/ openwiki/

      - name: Commit to main (only when something actually changed)
        run: |
          set -euo pipefail
          git add openwiki user-guide .github/wiki-assets
          if git diff --cached --quiet; then
            echo "openwiki/, user-guide/ and .github/wiki-assets/ already match the wiki — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: import wiki edits into openwiki/, user-guide/ and .github/wiki-assets/ [wiki-sync]"
          git push origin main
          echo "openwiki/, user-guide/ and .github/wiki-assets/ updated from the wiki."
