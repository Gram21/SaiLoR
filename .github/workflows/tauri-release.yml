name: Tauri release

# Phase 5 of docs/tauri-migration.md: build the Tauri app on every OS and
# attach installers, signed updater artifacts and latest.json to a DRAFT
# release. Uses `tauri-v*` tags so it never collides with the Electron
# release.yml (`v*` releases); release.yml skips `tauri-v*` releases.
# Setup (signing key, secrets): docs/tauri-migration.md section 16.

on:
  push:
    tags: ['tauri-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Check version, public key and signing key
        id: tag
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="tauri-v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version (expected $TAG)"; exit 1
          fi
          if jq -e '.plugins.updater.pubkey | startswith("REPLACE_")' src-tauri/tauri.conf.json > /dev/null; then
            echo "::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json (see docs/tauri-migration.md section 16)"; exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Find or create draft release
        id: draft
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if json=$(gh release view "$TAG" --json databaseId,isDraft 2>/dev/null); then
            if [ "$(jq -r .isDraft <<<"$json")" != true ]; then
              echo "::error::Release $TAG is already published"; exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "SaiLoR $VERSION (Tauri)" \
              --notes "Tauri build of SaiLoR $VERSION. Requires macOS 15 or later. The AppImage, Windows and macOS builds update in-app. Update the .deb and .rpm packages manually. Electron users install this release once by hand."
            json=$(gh release view "$TAG" --json databaseId,isDraft)
          fi
          echo "id=$(jq -r .databaseId <<<"$json")" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Optional. Without secrets the app is ad-hoc signed (identity "-").
      # Only non-empty values are exported: an empty APPLE_* variable makes the
      # Tauri bundler attempt a signing or notarization step and fail.
      - name: macOS signing and notarization (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:--}" >> "$GITHUB_ENV"
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then printf '%s=%s\n' "$v" "$(printf %s "${!v}" | tr -d '\r\n')" >> "$GITHUB_ENV"; fi
          done

      # Optional. Without secrets the NSIS installer is unsigned.
      - name: Windows code signing (optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } |
            ConvertTo-Json -Depth 4 | Set-Content src-tauri/tauri.windows.conf.json

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

  # The build jobs merge their platform into latest.json one after another; a
  # race can drop one. Re-run the failed build job to add the platform back.
  check-updater-json:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: latest.json lists every platform
        env:
          ID: ${{ needs.release.outputs.id }}
        run: |
          asset=$(gh api "repos/$GH_REPO/releases/$ID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$asset" > latest.json
          jq . latest.json
          jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64") and has("linux-x86_64")' latest.json
