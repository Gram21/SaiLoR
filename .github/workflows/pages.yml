name: Pages

# Publish the project site (site/) and the online demo (dist-demo/, served under
# /demo/) to GitHub Pages. The assembly lives in scripts/build-pages.sh so it can
# be run locally; this workflow only supplies the Pages deployment steps.
#
# Requires a one-time setting: Settings > Pages > Build and deployment >
# Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments to Pages are never cancelled part way through; the newest run waits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build the online demo
        run: npm run build:demo

      - name: Assemble the site
        run: ./scripts/build-pages.sh

      - name: Check site links
        run: node scripts/check-site-links.js _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
