name: Publish openwiki → Wiki

# Mirrors openwiki/ (developer docs) and user-guide/ (the user guide) into the GitHub
# wiki (https://github.com/Gram21/SaiLoR.wiki.git), as two parts under one Home page
# that lets a reader pick which one they want. The wiki is *replaced* by these two
# folders: a page that no longer exists in either one is deleted from the wiki, so the
# folders are the single source of truth.
#
# Layout published to the wiki:
#   Home.md          — always synthesized here (see "Build the wiki content" below):
#                       a short landing page linking to Development and user-guide/README.
#   Development.md    — openwiki/Home.md, renamed so the wiki's own Home slot is free
#                       for the landing page above.
#   <page>.md          — the rest of openwiki/*.md, unchanged, flat at the wiki root.
#   _Sidebar.md, _Footer.md — openwiki/_Sidebar.md and _Footer.md, with a "User Guide"
#                       section appended so the wiki's one (global) sidebar covers both
#                       parts. See the sidebar step below for why this is appended here
#                       rather than hand-edited into the openwiki source.
#   user-guide/**      — user-guide/*.md and user-guide/screenshots/*.png, unchanged,
#                       under a matching subfolder (their existing relative links —
#                       between pages and to screenshots/ — already work unmodified
#                       once the folder is copied as a whole).
#
# The reverse direction lives in wiki-import.yml. On the loop the two could form,
# see "Loop prevention" below.

on:
  push:
    branches: [main]
    paths:
      - 'openwiki/**'
      - 'user-guide/**'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with wiki-import.yml: the two must never run at the same time, or they
# would race on the same wiki. `cancel-in-progress: false` — a half-finished mirror
# is worse than a slow one.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Loop prevention, layer 2 (see below): never re-publish a commit that the
    # import workflow itself created.
    if: ${{ !contains(github.event.head_commit.message, '[wiki-sync]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Could not clone the wiki. A repository's wiki does not exist as a git" \
                 "repo until its first page is created — open the Wiki tab and save any page once," \
                 "then re-run this workflow."
            exit 1
          fi

      - name: Build the wiki content from openwiki/ and user-guide/
        run: |
          set -euo pipefail
          mkdir -p stage

          # --- Developer docs: openwiki/*.md, flat at the wiki root, same as before ---
          # Pages only, excluding files that are OpenWiki's own bookkeeping rather
          # than content for this audience:
          #   - `.last-update.json` is state for the openwiki generator.
          #   - `index.md` is Open Knowledge Format's own directory listing (see
          #     https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)
          #     — a machine-oriented "scan the bundle" page for agents reading the repo's
          #     openwiki/ folder directly. Home.md + _Sidebar.md already are the
          #     hand-curated equivalent for a human wiki visitor, so mirroring index.md
          #     too would only add a second, redundant, unlinked page. It stays in the
          #     repo (its actual audience reads it there) but never reaches the wiki.
          #     `log.md` — OKF's changelog of documentation updates — has no such
          #     overlap and IS published like any other page.
          #   - `INSTRUCTIONS.md` is the shared, user-authored brief handed *to* the
          #     generator (see .github/workflows/openwiki.yml) — config it reads, not a
          #     page it writes for a reader. Same reasoning as index.md: nothing in the
          #     wiki would ever link to it, so it stays in the repo instead of becoming
          #     an orphaned wiki page.
          #   - `Home.md` is staged as `Development.md` instead — the wiki's own Home
          #     slot is reserved for the two-part landing page synthesized below, so
          #     openwiki's own landing page (developer docs) moves aside to make room.
          for f in openwiki/*.md; do
            case "$(basename "$f")" in
              index.md|INSTRUCTIONS.md) continue ;;
              Home.md) cp "$f" "stage/Development.md" ;;
              *) cp "$f" "stage/$(basename "$f")" ;;
            esac
          done

          # --- User guide: user-guide/*.md + user-guide/screenshots/, under a matching
          # subfolder. Copied whole, not flattened, so the pages' existing relative
          # links (to each other, and to screenshots/*.png) keep working unmodified —
          # gollum (the wiki's renderer) resolves them the same way a plain filesystem
          # would. Two links inside user-guide/README.md are the exception: they point
          # at ../README.md and ../LICENSE, i.e. outside user-guide/ in the *main* repo —
          # correct there, but there is no such path in the wiki (a separate git repo
          # with no root README.md of its own), so they are rewritten to absolute GitHub
          # URLs a few steps down, once the file is in place.
          mkdir -p stage/user-guide
          cp -r user-guide/. stage/user-guide/

          # OpenWiki pages may carry Open Knowledge Format's YAML frontmatter (a leading
          # `---`-delimited block: type/title/description/tags/timestamp). GitHub's wiki
          # renderer (gollum) has no concept of frontmatter, so left in place it would
          # render as literal text at the top of the page — strip it before it ever
          # reaches the wiki. `index.md`'s exclusion above means it never needs this (OKF
          # forbids frontmatter on it anyway); user-guide pages never have one either, so
          # this runs unconditionally over every staged page (both parts) and is a no-op
          # wherever there isn't one.
          find stage -name '*.md' | while read -r f; do
            awk 'NR==1 && $0=="---"{infm=1; next} infm && $0=="---"{infm=0; next} !infm' \
              "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          # The two out-of-wiki links noted above.
          sed -i \
            -e "s#(\.\./README\.md)#(https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)#" \
            -e "s#(\.\./LICENSE)#(https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE)#" \
            stage/user-guide/README.md

          # openwiki/_Sidebar.md links its own top "SaiLoR" entry to `Home` — true when
          # Home.md *was* the developer docs' own landing page, broken now that it moved
          # to Development.md above. This is the one place that rename needs to be
          # reflected outside the file that moved, so it is fixed by rewriting the
          # staged copy rather than by editing the openwiki source (see the sidebar
          # step below for why edits like this stay off the openwiki source entirely).
          if [ -f stage/_Sidebar.md ]; then
            sed -i 's/\](Home)/\](Development)/' stage/_Sidebar.md
          fi

          # A wiki with no developer-docs landing page shows a dead "Development" link,
          # so synthesize one when openwiki/ did not provide a Home.md to rename above.
          # The marker lets wiki-import.yml recognise this file as ours and not copy it
          # back into the repo as a real openwiki page.
          if [ ! -f stage/Development.md ]; then
            {
              echo "<!-- wiki-sync:auto-home -->"
              echo "# SaiLoR — Developer Documentation"
              echo
              echo "These pages are generated from [\`openwiki/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/openwiki)"
              echo "in the main repository. Edits made here are synced back into that folder."
              echo
              for f in stage/*.md; do
                [ -f "$f" ] || continue
                page="$(basename "$f" .md)"
                # Skip the landing pages and the wiki's special pages (_Sidebar,
                # _Footer) — those are chrome, not content.
                case "$page" in Home|Development|_*) continue ;; esac
                # First heading of the page, falling back to the file name.
                title="$(grep -m1 '^# ' "$f" | sed 's/^# //')"
                echo "- [${title:-$page}]($page)"
              done
            } > stage/Development.md
          fi

          # _Sidebar.md and _Footer.md are gollum's *global* chrome — one copy applies
          # to every page in the wiki, developer and user-guide alike — so the sidebar
          # generated from openwiki/ (developer nav only) needs a "User Guide" section
          # appended to actually serve as the whole wiki's table of contents. This is
          # appended here, to the staged copy, rather than hand-added to the openwiki
          # source: openwiki/_Sidebar.md is regenerated by the OpenWiki tool (see
          # .github/workflows/openwiki.yml) from its own view of the *developer* docs,
          # so anything about the user guide written directly into that source would
          # just be dropped on its next scheduled run. Appending at publish time instead
          # means it survives regeneration for free, at the cost of one known asymmetry:
          # an edit made to *this* appended section via the wiki's web UI does not round
          # -trip back (wiki-import.yml still imports the edited file as a whole into
          # openwiki/_Sidebar.md, so the next publish immediately overwrites the User
          # Guide part again with this same generated text) — the same trade-off this
          # workflow already accepts for frontmatter, just applied to a second case.
          if [ -f stage/_Sidebar.md ]; then
            {
              echo
              echo "---"
              echo
              echo "### [🏠 Wiki home](Home)"
              echo
              echo "### [User Guide](user-guide/README)"
              echo
              # Fixed order, matching user-guide/README.md's own "Guide contents" table
              # (a curated reading order, not alphabetical) — update both places
              # together if a page there is added, renamed, or reordered.
              for name in things-to-know getting-started screening multi-reviewer project-editor git; do
                f="stage/user-guide/$name.md"
                [ -f "$f" ] || continue
                title="$(grep -m1 '^# ' "$f" | sed 's/^# //')"
                echo "- [${title:-$name}](user-guide/$name)"
              done
            } >> stage/_Sidebar.md
          fi
          if [ -f stage/_Footer.md ]; then
            printf ' · [User Guide](user-guide/README)\n' >> stage/_Footer.md
          fi

          # The wiki's actual Home page is always this two-part landing page — never
          # taken from openwiki/ or user-guide/ directly, since neither one alone can
          # represent "pick a part". The marker lets wiki-import.yml recognise it as
          # generated and skip importing it back as a real page (see wiki-import.yml).
          {
            echo "<!-- wiki-sync:auto-home -->"
            echo "# SaiLoR Wiki"
            echo
            echo "**SaiLoR** helps reviewers run **Systematic Literature Reviews (SLR)**: a single JSON"
            echo "project file holds the annotation schema and the papers to review; SaiLoR renders each"
            echo "paper's PDF next to a form generated from that schema."
            echo
            echo "This wiki has two parts:"
            echo
            echo "### 📘 [Development documentation](Development)"
            echo
            echo "How SaiLoR is built — architecture, the platform-adapter seam, the data model, and"
            echo "day-to-day engineering operations. Generated from"
            echo "[\`openwiki/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/openwiki)."
            echo
            echo "### 📗 [User guide](user-guide/README)"
            echo
            echo "How to use SaiLoR — installing it, annotating papers, screening, working with several"
            echo "reviewers, and git support, with screenshots. Generated from"
            echo "[\`user-guide/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/user-guide)."
          } > stage/Home.md

      - name: Mirror into the wiki
        run: |
          set -euo pipefail
          # --delete makes this a replace, not a merge: a page removed from openwiki/
          # or user-guide/ disappears from the wiki.
          rsync -a --delete --exclude '.git/' stage/ wiki/

      - name: Commit and push (only when something actually changed)
        working-directory: wiki
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches openwiki/ — nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync wiki from openwiki/ + user-guide/ (${GITHUB_SHA:0:7}) [wiki-sync]"
          git push
          echo "Wiki updated from openwiki/ and user-guide/."
