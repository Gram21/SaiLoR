name: Publish openwiki → Wiki

# Mirrors openwiki/ (developer docs) and user-guide/ (the user guide) into the GitHub
# wiki (https://github.com/Gram21/SaiLoR.wiki.git), as two parts under one Home page
# that lets a reader pick which one they want. The wiki is *replaced* by these two
# folders: a page that no longer exists in either one is deleted from the wiki, so the
# folders are the single source of truth.
#
# Layout published to the wiki:
#   Home.md          — always .github/wiki-assets/Home.md, verbatim: a short landing
#                       page linking to User-Guide first, then Development.
#   Development.md    — openwiki/Home.md, renamed so the wiki's own Home slot is free
#                       for the landing page above.
#   <page>.md          — the rest of openwiki/*.md, unchanged, flat at the wiki root.
#   _Sidebar.md        — the "🏠 Wiki home" link and "User Guide" fragment
#                       (.github/wiki-assets/Sidebar-user-guide.md) first, then
#                       .github/wiki-assets/Sidebar.md (the developer-docs sidebar —
#                       deliberately kept out of openwiki/ itself, see the copy step
#                       below) — user guide leads, developer docs follow, matching
#                       Home.md.
#   _Footer.md          — .github/wiki-assets/Footer.md (developer-docs footer, also
#                       kept out of openwiki/), then the "User Guide" fragment
#                       (Footer-user-guide.md) appended last — order unchanged from the
#                       sidebar's, since a footer reads along one line, not top-to-bottom.
#                       Both fragments sit inside a `<!-- wiki-sync:NAME:start/end -->`
#                       comment pair; see wiki-import.yml for what the markers are for.
#   User-Guide.md, Guide-*.md — user-guide/*.md, one page per file, flattened to the
#                       wiki root and renamed (README → User-Guide, things-to-know →
#                       Guide-Things-To-Know, etc. — see the GUIDE_PAGE table below).
#                       GitHub's hosted wiki does not serve pages that live in a
#                       subdirectory — the file exists in the wiki's git history but has
#                       no page URL, a 404 the instant anything links to it — so, unlike
#                       user-guide/'s own copy in the main repo (which keeps its natural
#                       folder and short names, and is what a repo browser or the README
#                       actually links to), the *published* copy cannot be a folder.
#                       Their cross-links to each other, previously bare filenames
#                       (`getting-started.md`), are rewritten to the flat names below.
#   screenshots/**      — user-guide/screenshots/*.png, flattened to the wiki root
#                       alongside the pages above — a plain asset folder, not a set of
#                       pages needing their own URLs, so nesting it wasn't the problem,
#                       but flattening it to sit next to the now-flat pages that
#                       reference it (`<img src="screenshots/x.png">`) keeps every one
#                       of those references correct without rewriting them too.
#
# .github/wiki-assets/ holds everything above that is really about *publishing to the
# wiki* rather than about the app or its developer docs — plain markdown, easier to
# review and edit than the equivalent shell heredocs, plus the marker comments that let
# wiki-import.yml identify each piece inside the published page it ends up in (Home.md
# and Sidebar.md/Footer.md as a whole; the two fragments within the latter two).
#
# The reverse direction lives in wiki-import.yml. On the loop the two could form,
# see "Loop prevention" below.

on:
  push:
    branches: [main]
    paths:
      - 'openwiki/**'
      - 'user-guide/**'
      - '.github/wiki-assets/**'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with wiki-import.yml: the two must never run at the same time, or they
# would race on the same wiki. `cancel-in-progress: false` — a half-finished mirror
# is worse than a slow one.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Loop prevention, layer 2 (see below): never re-publish a commit that the
    # import workflow itself created.
    if: ${{ !contains(github.event.head_commit.message, '[wiki-sync]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Could not clone the wiki. A repository's wiki does not exist as a git" \
                 "repo until its first page is created — open the Wiki tab and save any page once," \
                 "then re-run this workflow."
            exit 1
          fi

      - name: Build the wiki content from openwiki/ and user-guide/
        run: |
          set -euo pipefail
          mkdir -p stage

          # --- Developer docs: openwiki/*.md, flat at the wiki root, same as before ---
          # Pages only, excluding files that are OpenWiki's own bookkeeping rather
          # than content for this audience:
          #   - `.last-update.json` is state for the openwiki generator.
          #   - `index.md` is Open Knowledge Format's own directory listing (see
          #     https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)
          #     — a machine-oriented "scan the bundle" page for agents reading the repo's
          #     openwiki/ folder directly. Home.md + .github/wiki-assets/Sidebar.md
          #     already are the hand-curated equivalent for a human wiki visitor, so
          #     mirroring index.md too would only add a second, redundant, unlinked
          #     page. It stays in the repo (its actual audience reads it there) but
          #     never reaches the wiki. `log.md` — OKF's changelog of documentation
          #     updates — has no such overlap and IS published like any other page.
          #   - `INSTRUCTIONS.md` is the shared, user-authored brief handed *to* the
          #     generator (see .github/workflows/openwiki.yml) — config it reads, not a
          #     page it writes for a reader. Same reasoning as index.md: nothing in the
          #     wiki would ever link to it, so it stays in the repo instead of becoming
          #     an orphaned wiki page.
          #   - `Home.md` is staged as `Development.md` instead — the wiki's own Home
          #     slot is reserved for the two-part landing page synthesized below, so
          #     openwiki's own landing page (developer docs) moves aside to make room.
          # openwiki/ itself no longer has a `_Sidebar.md`/`_Footer.md` to skip here —
          # see the next step for where those now come from and why.
          OPENWIKI_PAGES=""
          for f in openwiki/*.md; do
            case "$(basename "$f")" in
              index.md|INSTRUCTIONS.md) continue ;;
              Home.md) cp "$f" "stage/Development.md"; OPENWIKI_PAGES="$OPENWIKI_PAGES Home:Development" ;;
              *)
                cp "$f" "stage/$(basename "$f")"
                OPENWIKI_PAGES="$OPENWIKI_PAGES $(basename "$f" .md):$(basename "$f" .md)"
                ;;
            esac
          done

          # --- User guide: user-guide/*.md, flattened to the wiki root under new names
          # (see the header above for why) — screenshots/ is the one thing that keeps
          # its own subfolder, since it holds assets rather than pages. A plain
          # space-separated list of "src:dest" pairs rather than an associative array:
          # this script only needs to loop over it, never look up one specific entry, so
          # the extra portability (no bash-4-only syntax) costs nothing.
          GUIDE_PAGES="README:User-Guide things-to-know:Guide-Things-To-Know getting-started:Guide-Getting-Started screening:Guide-Screening multi-reviewer:Guide-Multi-Reviewer project-editor:Guide-Project-Editor git:Guide-Git"
          for pair in $GUIDE_PAGES; do
            cp "user-guide/${pair%%:*}.md" "stage/${pair#*:}.md"
          done
          mkdir -p stage/screenshots
          cp -r user-guide/screenshots/. stage/screenshots/

          # OpenWiki pages may carry Open Knowledge Format's YAML frontmatter (a leading
          # `---`-delimited block: type/title/description/tags/timestamp). GitHub's wiki
          # renderer (gollum) has no concept of frontmatter, so left in place it would
          # render as literal text at the top of the page — strip it before it ever
          # reaches the wiki. `index.md`'s exclusion above means it never needs this (OKF
          # forbids frontmatter on it anyway); nothing else staged so far carries one
          # either (.github/wiki-assets/ and user-guide/ pages never do), so this runs
          # unconditionally over every staged page and is simply a no-op everywhere else.
          find stage -name '*.md' | while read -r f; do
            awk 'NR==1 && $0=="---"{infm=1; next} infm && $0=="---"{infm=0; next} !infm' \
              "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          # openwiki/*.md's own cross-links between its pages are bare filenames WITH
          # the ".md" extension (`[Architecture](architecture.md)`) — correct for
          # browsing openwiki/ directly in the repo (a real relative path to a real
          # file), which is one of its two audiences and the reason
          # scripts/check-wiki-links.js accepts both forms as equivalent. But the wiki
          # gives each page a URL with no extension (`.../wiki/architecture`), so once
          # mirrored there, the very same link is a dead one, not a working shortcut —
          # this is what actually broke the "Architecture" link (and every other
          # openwiki cross-link) once published. Rewritten here, on the staged copies
          # only, the same way the GUIDE_PAGES loop below does it for user-guide links;
          # openwiki's own copy in the main repo is left exactly as it needs to be.
          # Home.md is staged as Development.md above, so its own link target is
          # rewritten to match via the same "src:dest" pairing, not just a plain
          # ".md" strip.
          for pair in $OPENWIKI_PAGES; do
            sed -i "s#(${pair%%:*}\.md#(${pair#*:}#g" stage/*.md
          done

          # user-guide/README.md has links that point outside user-guide/ into the *main*
          # repo (../README.md, ../LICENSE, some with a #heading anchor) — correct there,
          # but there is no such path in the wiki (a separate git repo with no root
          # README.md of its own), so they are rewritten to absolute GitHub URLs on the
          # now-flattened copy. GitHub's blob viewer honours the same #anchor on a
          # rendered .md file, so a rewritten link still lands on the right heading.
          #
          # No trailing `)` in the pattern — same trick as the GUIDE_PAGES loop below:
          # matching only up through the file name, not the closing paren, means one
          # pattern handles both a bare `(../README.md)` link and one with an anchor
          # (`(../README.md#quick-start)`), leaving whatever follows untouched.
          sed -i \
            -e "s#(\.\./README\.md#(https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md#" \
            -e "s#(\.\./LICENSE#(https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE#" \
            stage/User-Guide.md

          # Every other link between guide pages is a bare filename with its original,
          # unflattened name (`[Screening](screening.md)`, `[...](things-to-know.md#...)`)
          # — correct in user-guide/'s own copy in the main repo, which is what these
          # sed patterns leave alone; rewritten only on the flattened copies staged
          # above, to the matching flat name from GUIDE_PAGES. `s#(name\.md#(NewName#`
          # (no trailing `)` or `#` in the pattern) matches both a bare `(name.md)` link
          # and one with an anchor (`(name.md#anchor)`), since it only replaces the
          # "name.md" text and leaves whatever follows untouched.
          for pair in $GUIDE_PAGES; do
            sed -i "s#(${pair%%:*}\.md#(${pair#*:}#g" stage/User-Guide.md stage/Guide-*.md
          done

          # _Sidebar.md and _Footer.md are gollum's *global* chrome — one copy applies
          # to every page in the wiki, developer and user-guide alike — so
          # .github/wiki-assets/Sidebar.md/Footer.md (developer nav only) each need a
          # "User Guide" section to actually serve as the whole wiki's table of
          # contents. That fragment lives in a third asset file,
          # .github/wiki-assets/Sidebar-user-guide.md (and Footer-user-guide.md below),
          # wrapped in a `<!-- wiki-sync:NAME:start/end -->` comment pair GitHub hides
          # when rendering — wiki-import.yml looks for that same pair to lift a wiki-UI
          # edit straight back into the asset file, and to strip the fragment back out
          # of what continues on to become the plain Sidebar.md/Footer.md asset again.
          #
          # The user guide leads in the sidebar, the developer docs follow — Footer.md
          # keeps the opposite order (its own links first, "User Guide" appended last)
          # since a footer reads left-to-right along one line rather than top-to-bottom,
          # so "leads" has no equivalent there.
          # The trailing `echo` blank line keeps the dev content below from butting
          # straight up against the (invisible, but still line-based) end marker.
          # wiki-import.yml strips exactly the marker pair and everything between them,
          # so that blank line lands back on Sidebar.md's own side as a harmless leading
          # blank line on import — the same class of cosmetic-only imperfection already
          # accepted elsewhere here (frontmatter stripping, a stray trailing blank line
          # on the pre-reorder layout this replaced).
          {
            echo '<!-- wiki-sync:user-guide-sidebar:start -->'
            cat .github/wiki-assets/Sidebar-user-guide.md
            echo '<!-- wiki-sync:user-guide-sidebar:end -->'
            echo
          } > stage/_Sidebar.md
          cat .github/wiki-assets/Sidebar.md >> stage/_Sidebar.md
          cp .github/wiki-assets/Footer.md stage/_Footer.md
          {
            echo '<!-- wiki-sync:user-guide-footer:start -->'
            cat .github/wiki-assets/Footer-user-guide.md
            echo '<!-- wiki-sync:user-guide-footer:end -->'
          } >> stage/_Footer.md

          # .github/wiki-assets/Sidebar.md links its own top "SaiLoR" entry to `Home` —
          # correct as far as that file is concerned (openwiki/Home.md really is named
          # Home, which is exactly what lets scripts/check-wiki-links.js validate the
          # link against the real openwiki page set) but broken once published, since
          # Home.md is staged as Development.md above. Fixed here, on the staged copy
          # only, rather than by writing "Development" into the asset file itself.
          # Matched on the exact `[SaiLoR](Home)` link text, not just `](Home)` — the
          # user-guide fragment prepended above has its own, deliberately unrelated
          # `[🏠 Wiki home](Home)` link that must keep pointing at the real Home page.
          sed -i 's/\[SaiLoR\](Home)/[SaiLoR](Development)/' stage/_Sidebar.md

          # A wiki with no developer-docs landing page shows a dead "Development" link,
          # so synthesize one when openwiki/ did not provide a Home.md to rename above.
          # The marker (the same one .github/wiki-assets/Home.md carries) lets
          # wiki-import.yml recognise this file as ours and not copy it back into the
          # repo as a real openwiki page.
          if [ ! -f stage/Development.md ]; then
            {
              echo "<!-- wiki-sync:auto-home -->"
              echo "# SaiLoR — Developer Documentation"
              echo
              echo "These pages are generated from [\`openwiki/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/openwiki)"
              echo "in the main repository. Edits made here are synced back into that folder."
              echo
              for f in stage/*.md; do
                [ -f "$f" ] || continue
                page="$(basename "$f" .md)"
                # Skip the landing pages, the wiki's special pages (_Sidebar, _Footer —
                # chrome, not content), and the flattened user-guide pages (a different
                # section entirely, already linked from Home.md and the sidebar).
                case "$page" in Home|Development|User-Guide|Guide-*|_*) continue ;; esac
                # First heading of the page, falling back to the file name.
                title="$(grep -m1 '^# ' "$f" | sed 's/^# //')"
                echo "- [${title:-$page}]($page)"
              done
            } > stage/Development.md
          fi

          # The wiki's actual Home page is always .github/wiki-assets/Home.md, verbatim
          # — never taken from openwiki/ or user-guide/ directly, since neither one
          # alone can represent "pick a part". Its first line is the same
          # `wiki-sync:auto-home` marker the Development.md fallback above carries; see
          # wiki-import.yml for what reads it.
          cp .github/wiki-assets/Home.md stage/Home.md

      - name: Mirror into the wiki
        run: |
          set -euo pipefail
          # --delete makes this a replace, not a merge: a page removed from openwiki/
          # or user-guide/ disappears from the wiki.
          rsync -a --delete --exclude '.git/' stage/ wiki/

      - name: Commit and push (only when something actually changed)
        working-directory: wiki
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches openwiki/ — nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync wiki from openwiki/ + user-guide/ (${GITHUB_SHA:0:7}) [wiki-sync]"
          git push
          echo "Wiki updated from openwiki/ and user-guide/."
