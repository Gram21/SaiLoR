name: Technical report

on:
  push:
    paths:
      - 'technical-report/**'
      - 'user-guide/screenshots/**'
      - '.github/workflows/technical-report.yml'
  pull_request:
    paths:
      - 'technical-report/**'
      - 'user-guide/screenshots/**'
      - '.github/workflows/technical-report.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile report
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          working_directory: technical-report
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -jobname=SaiLoR-technical-report

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SaiLoR-technical-report
          path: technical-report/SaiLoR-technical-report.pdf
