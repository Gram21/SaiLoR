name: Technical report

on:
  push:
    branches: [main]
    paths:
      - 'technical-report/**'
      - 'user-guide/screenshots/**'
      - '.github/workflows/technical-report.yml'
  pull_request:
    paths:
      - 'technical-report/**'
      - 'user-guide/screenshots/**'
      - '.github/workflows/technical-report.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile report
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          working_directory: technical-report
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -jobname=SaiLoR-technical-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SaiLoR-technical-report
          path: technical-report/SaiLoR-technical-report.pdf
