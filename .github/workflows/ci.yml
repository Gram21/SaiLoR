name: CI

# Test that the application type-checks, passes its tests, and builds.
# The actual work lives in scripts/ci.sh so it can be run locally or on any
# other CI provider (e.g. GitLab) with minimal, provider-specific glue here.

on:
  push:
    branches: [main]
    paths-ignore: ['technical-report/**']
  # Every pull request, whatever it targets — a PR onto a release branch needs
  # the same checks as one onto main. Deliberately *not* combined with a
  # push-on-every-branch trigger: a branch with an open PR would then build
  # twice for each push, once per trigger, for no extra signal.
  pull_request:
    paths-ignore: ['technical-report/**']
  # Allow running the workflow manually from the Actions tab.
  workflow_dispatch:

# Only the newest commit on a ref is worth checking; cancel the runs it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Run CI script
        run: ./scripts/ci.sh

  # The Tauri shell (src-tauri/, docs/tauri-migration.md).
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
