name: CI

# One workflow for everything that checks code. This file only provisions
# toolchains and calls scripts, so every job also runs on a developer machine
# or another CI provider:
#   build       scripts/ci.sh              (also: make ci)
#   rust        scripts/ci/rust.sh         (make ci-rust)
#   trace       scripts/ci/trace.sh        (make ci-trace)
#   tauri-build scripts/ci/bundle.sh       (make ci-bundle)
#   tauri-e2e   scripts/ci/e2e.sh          (make ci-e2e)
# Release and report workflows stay separate.

on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['technical-report/**']
  # Every pull request, whatever it targets. Not combined with a push-on-every-branch
  # trigger: a branch with an open PR would build twice per push for no extra signal.
  pull_request:
    paths-ignore: ['technical-report/**']
  workflow_dispatch:

# Only the newest commit on a ref is worth checking; cancel the runs it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Run CI script
        run: ./scripts/ci.sh

  # Lint the Tauri shell (src-tauri/). Tests run per OS in tauri-build.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        run: scripts/ci/linux-deps.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: scripts/ci/rust.sh

  # Requirement trace links (OpenFastTrace). Allowed to fail until the trace tags are in the sources.
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: scripts/ci/trace.sh

      - name: Upload trace report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-report
          path: .cache/oft/trace.*
          if-no-files-found: ignore

  # Rust tests, installer bundle and a probe run in each system WebView.
  # The probe is a separate build (e2e/ page, `probe` feature). The release app has no probe commands.
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: scripts/ci/linux-deps.sh xvfb

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: scripts/ci/bundle.sh
        env:
          REPORT: ${{ runner.temp }}/probe-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-report-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-report.txt
          if-no-files-found: ignore

  # tauri-driver has no macOS support, so there is no macOS job.
  tauri-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/ci/linux-deps.sh webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: cargo install tauri-driver --locked

      - name: Install msedgedriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client") | ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath $dir -Force
          Write-Host "WebView2 $version; $(& "$dir\msedgedriver.exe" --version)"
          $dir >> $env:GITHUB_PATH

      - run: scripts/ci/e2e.sh build

      - name: Run e2e test (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci/e2e.sh test

      # WebView2 ignores the driver's WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS in an elevated
      # process, and the runner is elevated. Run at medium integrity, as Tauri's own e2e CI does.
      - name: Run e2e test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium node --test e2e/probe.test.mjs
