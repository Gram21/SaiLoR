name: CI

# One workflow for everything that checks code: the renderer (scripts/ci.sh),
# the Rust shell (fmt, clippy), the Tauri build matrix on every OS, and the
# Tauri e2e test. Release and report workflows stay separate.
# The renderer work lives in scripts/ci.sh so it can run locally or on another CI provider.

on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['technical-report/**']
  # Every pull request, whatever it targets. Not combined with a push-on-every-branch
  # trigger: a branch with an open PR would build twice per push for no extra signal.
  pull_request:
    paths-ignore: ['technical-report/**']
  workflow_dispatch:

# Only the newest commit on a ref is worth checking; cancel the runs it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Run CI script
        run: ./scripts/ci.sh

  # Lint the Tauri shell (src-tauri/). Tests run per OS in tauri-build.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Rust tests, installer bundle and a probe run in each system WebView.
  # The probe is a separate build (e2e/ page, `probe` feature). The release app has no probe commands.
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (installer bundle)
        run: npx tauri build

      - name: Report installer sizes
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec ls -l {} \;

      - name: Build probe
        run: npx tauri build --no-bundle --features probe --config src-tauri/tauri.probe.conf.json

      - name: Run probe (open project, traversal check, render PDF)
        env:
          SAILOR_PROBE_PROJECT: ${{ github.workspace }}/samples/project.example.json
          SAILOR_PROBE_REPORT: ${{ runner.temp }}/probe-report.txt
        run: |
          rm -f "$SAILOR_PROBE_REPORT"
          BIN=src-tauri/target/release/sailor
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            xvfb-run -a "$BIN" > /dev/null 2>&1 &
          else
            "$BIN" > /dev/null 2>&1 &
          fi
          PID=$!
          for i in $(seq 1 60); do
            grep -qE "RENDER OK|PDF ERROR|RENDER ERROR" "$SAILOR_PROBE_REPORT" 2>/dev/null && break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          echo "---- report ----"
          cat "$SAILOR_PROBE_REPORT" || true
          grep -q "RENDER OK" "$SAILOR_PROBE_REPORT"
          grep -q -- "-> 403" "$SAILOR_PROBE_REPORT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-report.txt
          if-no-files-found: ignore

  # tauri-driver has no macOS support, so there is no macOS job.
  tauri-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo install tauri-driver --locked

      - name: Install msedgedriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client") | ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath $dir -Force
          Write-Host "WebView2 $version; $(& "$dir\msedgedriver.exe" --version)"
          $dir >> $env:GITHUB_PATH

      - run: npm ci

      - run: npx tauri build --no-bundle --features probe --config src-tauri/tauri.probe.conf.json

      - name: Run e2e test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node --test e2e/probe.test.mjs

      # WebView2 ignores the driver's WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS in an elevated
      # process, and the runner is elevated. Run at medium integrity, as Tauri's own e2e CI does.
      - name: Run e2e test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium node --test e2e/probe.test.mjs
