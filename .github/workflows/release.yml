name: Release

# Build the Electron desktop app for macOS, Windows, and Linux when a GitHub
# release is published, and attach the installers to that release.
#
# The build itself lives in scripts/build-electron.sh so it can be run locally
# and on any CI provider; this workflow only supplies the per-OS runners and
# the GitHub-specific upload of the produced artifacts.

on:
  release:
    types: [published]
  # Allow a manual dry run (builds artifacts, uploads nothing to a release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifacts: release/*.dmg
            feed: ''
          # The *installer* itself is unsigned: no Authenticode certificate is
          # configured (CSC_LINK/CSC_KEY_PASSWORD, or win.certificateSubjectName
          # + publisherName in package.json). That's a separate concern from
          # update *authenticity*, which the "Sign update metadata" step below
          # does cover: it signs `latest.yml`/`latest-linux.yml` with this
          # project's own Ed25519 release key, and `electron/main.ts` verifies
          # that signature (see `src/model/updateSignature.ts`) before ever
          # downloading an update — so a hostile release under this feed is
          # caught even without a purchased certificate. What a real
          # certificate would still add: removing Windows SmartScreen's
          # "unrecognized publisher" warning on the installer itself, which
          # only builds reputation through an Authenticode identity over time.
          - os: windows-latest
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
              release/latest.yml.sig
            feed: release/latest.yml
          - os: ubuntu-latest
            artifacts: |
              release/*.AppImage
              release/latest-linux.yml
              release/latest-linux.yml.sig
            feed: release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build packaged Electron app
        shell: bash
        run: ./scripts/build-electron.sh

      # Windows/Linux only (matrix.feed is empty on mac, which has no
      # electron-updater feed at all — see the comment above). Signs with
      # RELEASE_SIGNING_PRIVATE_KEY (an Ed25519 PEM secret); the matching
      # public key is baked into the app (`src/model/updateSignature.ts`).
      - name: Sign update metadata
        if: matrix.feed != ''
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: node scripts/sign-release.cjs "${{ matrix.feed }}"

      # Keep a copy on the workflow run so a manual (workflow_dispatch) build is
      # still downloadable even though there is no release to attach it to.
      - name: Upload build artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: sailor-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
