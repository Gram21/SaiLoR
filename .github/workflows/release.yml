name: Release

# Build the Electron desktop app for macOS, Windows, and Linux when a GitHub
# release is published, and attach the installers to that release.
#
# The build itself lives in scripts/build-electron.sh so it can be run locally
# and on any CI provider; this workflow only supplies the per-OS runners and
# the GitHub-specific upload of the produced artifacts.

on:
  release:
    types: [published]
  # Allow a manual dry run (builds artifacts, uploads nothing to a release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gates the build below: a broken end-to-end workflow (schema authoring,
  # PDF annotation, git commit, merge/pull/branch-switch/discard, screening
  # import — see src/test/integration/ and e2e/) must not reach a packaged
  # release. Pulled into its own reusable workflow (integration-tests.yml)
  # so it's also independently triggerable without a full release run.
  integration-tests:
    # tauri-v* releases come from tauri-release.yml; skipping here also skips build and zenodo.
    if: ${{ !startsWith(github.event.release.tag_name, 'tauri-v') }}
    uses: ./.github/workflows/integration-tests.yml

  build:
    needs: integration-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifacts: release/*.dmg
            feed: ''
          # The *installer* itself is unsigned: no Authenticode certificate is
          # configured (CSC_LINK/CSC_KEY_PASSWORD, or win.certificateSubjectName
          # + publisherName in package.json). That's a separate concern from
          # update *authenticity*, which the "Sign update metadata" step below
          # does cover: it signs `latest.yml`/`latest-linux.yml` with this
          # project's own Ed25519 release key, and `electron/main.ts` verifies
          # that signature (see `src/model/updateSignature.ts`) before ever
          # downloading an update — so a hostile release under this feed is
          # caught even without a purchased certificate. What a real
          # certificate would still add: removing Windows SmartScreen's
          # "unrecognized publisher" warning on the installer itself, which
          # only builds reputation through an Authenticode identity over time.
          - os: windows-latest
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
              release/latest.yml.sig
            feed: release/latest.yml
          - os: ubuntu-latest
            artifacts: |
              release/*.AppImage
              release/latest-linux.yml
              release/latest-linux.yml.sig
            feed: release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build packaged Electron app
        shell: bash
        run: ./scripts/build-electron.sh

      # Windows/Linux only (matrix.feed is empty on mac, which has no
      # electron-updater feed at all — see the comment above). Signs with
      # RELEASE_SIGNING_PRIVATE_KEY (an Ed25519 PEM secret); the matching
      # public key is baked into the app (`src/model/updateSignature.ts`).
      - name: Sign update metadata
        if: matrix.feed != ''
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: node scripts/sign-release.cjs "${{ matrix.feed }}"

      # Keep a copy on the workflow run so a manual (workflow_dispatch) build is
      # still downloadable even though there is no release to attach it to.
      - name: Upload build artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: sailor-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true

  # Archive the published release on Zenodo as a new version of the existing
  # record (shared concept DOI): source zip plus every release
  # asset, with the GitHub release notes as description. Runs after all
  # installers are attached. Publishing on Zenodo is permanent.
  zenodo:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      CONCEPT_RECID: "23804729"
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_BODY: ${{ github.event.release.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect source zip and release assets
        run: |
          mkdir upload
          git archive --format=zip --prefix="sailor-${TAG}/" -o "upload/sailor-${TAG}-source.zip" HEAD
          gh release download "$TAG" --dir upload

      - name: Create and publish Zenodo record
        run: |
          API=https://zenodo.org/api/deposit/depositions
          AUTH="Authorization: Bearer ${ZENODO_TOKEN}"

          DESCRIPTION=$(printf '%s' "${RELEASE_BODY:-Release ${TAG}}" \
            | gh api markdown -F text=@- -f mode=gfm 2>/dev/null \
            || printf '<p>Release %s</p>' "$TAG")

          METADATA=$(jq -n \
            --arg title "${RELEASE_NAME:-SaiLoR $TAG}" \
            --arg version "$TAG" \
            --arg description "$DESCRIPTION" \
            --arg url "${{ github.event.release.html_url }}" \
            '{metadata: {
              title: $title,
              upload_type: "software",
              description: $description,
              version: $version,
              license: "GPL-3.0-only",
              creators: [{name: "Keim, Jan", affiliation: "Karlsruhe Institute of Technology"}],
              related_identifiers: [{identifier: $url, relation: "isIdenticalTo", scheme: "url"}]
            }}')

          # Concept record: all SaiLoR versions share this DOI. Its API URL
          # redirects to the latest published version.
          LATEST=$(curl -fsSL "https://zenodo.org/api/records/${CONCEPT_RECID}" | jq -r .id)
          DRAFT_URL=$(curl -fsS -X POST "$API/$LATEST/actions/newversion" -H "$AUTH" | jq -r .links.latest_draft)
          DEPOSITION=$(curl -fsS "$DRAFT_URL" -H "$AUTH")
          ID=$(jq -r .id <<<"$DEPOSITION")
          BUCKET=$(jq -r .links.bucket <<<"$DEPOSITION")

          # A new version starts with the previous version's files.
          for fid in $(jq -r '.files[].id' <<<"$DEPOSITION"); do
            curl -fsS -X DELETE "$API/$ID/files/$fid" -H "$AUTH"
          done

          curl -fsS -X PUT "$API/$ID" -H "$AUTH" -H "Content-Type: application/json" -d "$METADATA" >/dev/null

          for f in upload/*; do
            curl -fsS --upload-file "$f" -H "$AUTH" "$BUCKET/$(basename "$f")" >/dev/null
          done

          curl -fsS -X POST "$API/$ID/actions/publish" -H "$AUTH" | jq -r '"Published: " + .links.html + " DOI " + .doi'
