name: Release

# Build the Electron desktop app for macOS, Windows, and Linux when a GitHub
# release is published, and attach the installers to that release.
#
# The build itself lives in scripts/build-electron.sh so it can be run locally
# and on any CI provider; this workflow only supplies the per-OS runners and
# the GitHub-specific upload of the produced artifacts.

on:
  release:
    types: [published]
  # Allow a manual dry run (builds artifacts, uploads nothing to a release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifacts: release/*.dmg
          # Unsigned: no code-signing certificate is configured (CSC_LINK/
          # CSC_KEY_PASSWORD, or win.certificateSubjectName + publisherName in
          # package.json). electron-updater's own signature-verification path
          # on Windows therefore has nothing to check the downloaded update
          # against, so the update feed's HTTPS transport + sha512 hash catch
          # a corrupted download but not a hostile one published under this
          # feed. Get a certificate (an EV or standard Authenticode cert) and
          # set both before relying on this for anything beyond convenience.
          - os: windows-latest
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-latest
            artifacts: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build packaged Electron app
        shell: bash
        run: ./scripts/build-electron.sh

      # Keep a copy on the workflow run so a manual (workflow_dispatch) build is
      # still downloadable even though there is no release to attach it to.
      - name: Upload build artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: sailor-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
