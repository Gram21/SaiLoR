<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33a9c6"/>
      <stop offset="1" stop-color="#1c7f9a"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background (app teal) -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#favBg)"/>

  <!-- The boat from build/icon.svg, simplified for a 16px tab: three text lines
       instead of five, and no checkmark (it turns to mush at that size). The red
       highlight line survives — that is the part that reads as "annotation". -->
  <rect x="30.5" y="8" width="3" height="37" rx="1.5" fill="#0f5c73"/>

  <!-- Jib -->
  <path d="M 30.5 13 L 30.5 44 L 14 44 Z" fill="#cfe6ee"/>

  <!-- Mainsail: a page, with one highlighted line -->
  <path d="M 33.5 10 L 33.5 44 L 53 44 Z" fill="#ffffff"/>
  <rect x="35.5" y="19" width="2.7"  height="2.6" rx="1.3" fill="#8fb9c6"/>
  <rect x="35.5" y="27" width="7.2"  height="2.6" rx="1.3" fill="#b71c1c"/>
  <rect x="35.5" y="35" width="11.8" height="2.6" rx="1.3" fill="#8fb9c6"/>

  <!-- Hull -->
  <path d="M 9 46.5 H 55 L 48.5 56 Q 46.5 58.5 43 58.5 H 21 Q 17.5 58.5 15.5 56 Z" fill="#0f5c73"/>
</svg>
