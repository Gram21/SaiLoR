server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers.
    #
    # These are repeated in every `location` block below that sets an
    # `add_header` of its own, and that duplication is load-bearing: nginx's
    # add_header directives are inherited only when the child level declares
    # *none*. A single `add_header Cache-Control` inside a location therefore
    # drops every server-level header for that location — silently. Do not
    # "clean this up" by keeping only the copy here; the asset locations, which
    # serve the JavaScript, are exactly where `nosniff` matters most.
    #
    # `always` matters too: without it nginx omits these on error responses,
    # which are the ones an attacker can most easily provoke.
    #
    # frame-ancestors has to be a *header* — the app's CSP is a <meta> tag, and
    # frame-ancestors is ignored there by specification, so until now nothing
    # stopped another site from framing a deployment and clickjacking it.
    # X-Frame-Options is the older equivalent, kept for browsers that want it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Project URLs can name a review's subject matter, so don't leak them to
    # third parties when a PDF's link annotation is followed out to the web.
    add_header Referrer-Policy "no-referrer" always;

    # nginx's default mime.types has no entry for .mjs, so ES modules (e.g. the
    # bundled pdf.js worker) would be served as application/octet-stream and the
    # browser would refuse to load them. This regex location fixes their type and
    # keeps the immutable caching. Regex locations take precedence over the
    # /assets/ prefix below, so it also covers hashed *.mjs assets.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Long-lived caching for content-hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Project files (JSON + PDFs) are served verbatim from the mounted volume.
    # `?project=/projects/<name>.json` in the app resolves its PDFs relative to this path.
    #
    # No `Access-Control-Allow-Origin` here, deliberately. This used to send
    # `*`, which let *any* website a reviewer happened to visit read every
    # project file this deployment serves — the review data, the reviewers'
    # recorded identities, the lot — with a plain fetch, needing only the URL.
    # For a deployment on localhost or an intranet, "needing only the URL" is a
    # low bar. Serving the app from the same origin as its projects, which is
    # what `docker-compose.yml` does and what the deployment docs describe,
    # needs no CORS header at all.
    #
    # If you genuinely serve the app from a *different* origin than its project
    # files, add the one origin you mean — never `*`:
    #
    #     add_header Access-Control-Allow-Origin "https://sailor.example.org" always;
    #
    # and see `openwiki/operations.md` for what that exposes.
    location /projects/ {
        try_files $uri =404;
    }

    # SPA fallback: unknown routes return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
