server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx's default mime.types has no entry for .mjs, so ES modules (e.g. the
    # bundled pdf.js worker) would be served as application/octet-stream and the
    # browser would refuse to load them. This regex location fixes their type and
    # keeps the immutable caching. Regex locations take precedence over the
    # /assets/ prefix below, so it also covers hashed *.mjs assets.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Long-lived caching for content-hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Project files (JSON + PDFs) are served verbatim from the mounted volume.
    # `?project=/projects/<name>.json` in the app resolves its PDFs relative to this path.
    location /projects/ {
        try_files $uri =404;
        # Allow the app (potentially on another origin) to fetch project files.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA fallback: unknown routes return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
