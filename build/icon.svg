<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4f1f6"/>
    </linearGradient>
    <linearGradient id="jib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33a9c6"/>
      <stop offset="1" stop-color="#1c7f9a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c7f9a"/>
      <stop offset="1" stop-color="#12667e"/>
    </linearGradient>
  </defs>

  <!-- Transparent background, free-form glyph: a boat whose mainsail is a page of
       text with one line highlighted (the annotation) and whose jib carries a
       checkmark (the review). The silhouette carries the icon at small sizes; the
       sail details are a bonus at large ones. Teal + highlight red, as in the app. -->
  <g transform="translate(-8 -40)">
    <!-- Mast -->
    <rect x="501" y="130" width="22" height="615" rx="11" fill="#17708a"/>

    <!-- Jib (front sail), carrying the checkmark -->
    <path d="M 501 230 L 501 738 L 215 738 C 260 560 340 380 501 230 Z" fill="url(#jib)"/>
    <path d="M 322 596 L 360 636 L 436 540" fill="none" stroke="#ffffff" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mainsail: a page. Outlined, or it would vanish against a light desktop -
         it is the largest shape in the glyph and very nearly white. -->
    <path d="M 523 165 L 523 738 L 880 738 C 830 550 700 320 523 165 Z"
          fill="url(#sail)" stroke="#17708a" stroke-width="18" stroke-linejoin="round"/>

    <!-- Lines of text, growing with the sail. The third one is highlighted. -->
    <rect x="556" y="290" width="36"  height="34" rx="17" fill="#8fb9c6"/>
    <rect x="556" y="372" width="87"  height="34" rx="17" fill="#8fb9c6"/>
    <rect x="556" y="454" width="138" height="34" rx="17" fill="#b71c1c"/>
    <rect x="556" y="536" width="189" height="34" rx="17" fill="#8fb9c6"/>
    <rect x="556" y="618" width="240" height="34" rx="17" fill="#8fb9c6"/>

    <!-- Hull -->
    <path d="M 168 748 H 902 L 802 902 Q 782 928 744 928 H 326 Q 288 928 268 902 Z"
          fill="url(#hull)"/>

    <!-- Water -->
    <path d="M 130 958 q 46 -34 92 0 t 92 0 t 92 0 t 92 0 t 92 0 t 92 0 t 92 0 t 92 0"
          fill="none" stroke="#33a9c6" stroke-width="26" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
