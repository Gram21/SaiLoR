<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconDoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33a9c6"/>
      <stop offset="1" stop-color="#1c7f9a"/>
    </linearGradient>
  </defs>

  <!-- Transparent background: a free-form glyph (document + magnifier), centered
       with padding. The teal document is the main mass, so white/outlined
       details stay legible on any background. -->
  <g transform="translate(512 512) scale(1.2) translate(-571.5 -533.5)">
    <!-- Document / page (ARDoCo teal) -->
    <rect x="272" y="196" width="420" height="560" rx="40" ry="40" fill="url(#iconDoc)"/>

    <!-- Text lines -->
    <rect x="336" y="288" width="292" height="34" rx="17" fill="#ffffff"/>
    <!-- Highlighted line (ARDoCo highlight red) -->
    <rect x="336" y="366" width="292" height="34" rx="17" fill="#b71c1c"/>
    <rect x="336" y="444" width="230" height="34" rx="17" fill="#ffffff"/>
    <rect x="336" y="522" width="292" height="34" rx="17" fill="#ffffff"/>
    <rect x="336" y="600" width="180" height="34" rx="17" fill="#ffffff"/>

    <!-- Magnifying glass overlapping lower-right, with checkmark inside lens -->
    <g>
      <!-- handle -->
      <line x1="726" y1="726" x2="836" y2="836" stroke="#17708a" stroke-width="70" stroke-linecap="round"/>
      <line x1="726" y1="726" x2="836" y2="836" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
      <!-- lens -->
      <circle cx="632" cy="632" r="150" fill="#ffffff" stroke="#17708a" stroke-width="30"/>
      <!-- checkmark -->
      <path d="M 566 634 L 614 682 L 706 578" fill="none" stroke="#2698ba" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
