# ---------------------------------------------------------------------------
# Build the Linux desktop app without installing Node or Rust locally:
#
#   docker compose -f docker-compose.dev.yml run --rm tauri-linux
# ---------------------------------------------------------------------------
services:
  # Tauri build: bundles land in ./src-tauri/target/release/bundle/.
  tauri-linux:
    build:
      context: .
      dockerfile: Dockerfile.tauri-linux
    image: sailor-tauri-linux:latest
    volumes:
      - .:/app
      - /app/node_modules
      - tauri-target:/app/src-tauri/target

  # SaiLoR in a container, shown at http://localhost:6080. See docs/building.md.
  tauri-linux-gui:
    build:
      context: .
      dockerfile: Dockerfile.tauri-linux-gui
    image: sailor-gui:latest
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      SCREEN_RESOLUTION: ${SCREEN_RESOLUTION:-1440x900}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    volumes:
      - ./projects:/data
      - sailor-home:/home/sailor

volumes:
  tauri-target:
  sailor-home:
